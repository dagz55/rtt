version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: vip_transaction_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=vip_transaction_tracker

